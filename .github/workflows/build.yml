name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  windows-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl
      - name: Install GLEW
        run: C:\vcpkg\vcpkg.exe install glew:x64-windows-static-md
      - name: Configure
        run: >
          cmake -S . -B out -A x64
          -DLASERMAP_BUILD_FFGL=ON
          -DFFGL_SDK_DIR=${{ github.workspace }}/ffgl
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Build
        run: cmake --build out --config Release --target LaserMap lasermap_tests
      - name: Test
        run: ctest --test-dir out -C Release --output-on-failure
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: LaserMap-windows-x64
          path: |
            out/plugin/ffgl/Release/LaserMap.dll
          if-no-files-found: error

  # Pangolin's BEYONDIO.dll is a 32-bit DLL, so the helper that loads it must be a 32-bit program.
  windows-bridge32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (32-bit)
        run: cmake -S . -B out32 -A Win32
      - name: Build
        run: cmake --build out32 --config Release --target lasermap_bridge lasermap_tests
      - name: Test
        run: ctest --test-dir out32 -C Release --output-on-failure
      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: LaserMap-bridge-win32
          path: out32/Release/lasermap_bridge.exe
          if-no-files-found: error

  # One download for users: plugin + 32-bit helper + installer.
  package:
    needs: [windows-plugin, windows-bridge32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LaserMap-windows-x64
          path: dl/plugin
      - uses: actions/download-artifact@v4
        with:
          name: LaserMap-bridge-win32
          path: dl/bridge
      - name: Assemble
        run: |
          mkdir -p LaserMap-Windows
          cp dl/plugin/LaserMap.dll LaserMap-Windows/
          cp dl/bridge/lasermap_bridge.exe LaserMap-Windows/
          cp packaging/Install-LaserMap.ps1 packaging/Install-LaserMap.bat packaging/Uninstall-LaserMap.ps1 packaging/Uninstall-LaserMap.bat packaging/README-FIRST.txt LaserMap-Windows/
          cp LICENSE LaserMap-Windows/
      - uses: actions/upload-artifact@v4
        with:
          name: LaserMap-Windows
          path: LaserMap-Windows
          if-no-files-found: error
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r LaserMap-Windows.zip LaserMap-Windows
      - name: Publish release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LaserMap-Windows.zip
          draft: true
